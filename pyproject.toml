[project]
name = "ichatbio-idigbio-agent"
version = "1"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "openai>3.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings==2.16.0",
    "instructor==1.17.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.34.3",
    "contextvars>=2.4",
    "langchain==1.4.6",
    "langchain_openai==1.7.2"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "INFO"
